# Next.js standalone output cannot be produced from pnpm's default symlinked
# node_modules: the tracer follows links into the .pnpm store and omits the
# top-level entries Node's CommonJS resolver needs, so the packaged server dies on
# boot with MODULE_NOT_FOUND (styled-jsx, @swc/helpers, ...). A hoisted, flat
# layout makes the traced bundle self-contained.
nodeLinker: hoisted

# Prisma must run its postinstall to generate the client and download the query
# engines (including the Linux engine the deployment package ships). sharp builds
# its native image binaries. These were previously left as unfilled placeholders,
# which silently skipped those build steps.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true

# The "pnpm" field has been removed from package.json rather than migrated here.
# Its overrides were never actually applied: pnpm 11 ignores that field, and the
# lockfile proves it - the override said `@prisma/dev: npm:prisma@7.4.1` while the
# lockfile resolved @prisma/dev@0.24.17. Meanwhile pnpm 10 (Vercel) *does* read
# the field, computed a different expected tree, and failed the frozen install
# with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# The overrides were not worth migrating:
#   - @types/react / @types/react-dom duplicated the devDependencies pins exactly
#   - @prisma/dev pinned a Prisma 5-era alias, stale now that the project is on 7.9.x
#   - ignoredBuiltDependencies listed bcrypt, which is not a dependency (bcryptjs is)
#
# Add `overrides:` here if one is ever genuinely needed - but note that doing so
# changes resolution and requires regenerating the lockfile.
